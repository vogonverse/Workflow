name: r_tfm
channels:
  - conda-forge
  - bioconda
  - r
dependencies:
  - r-base=4.3.2                      # actualiza a la versión estable más reciente compatible
  - bioconductor-biocversion=3.18
  - bioconductor-edger=4.0.16
  - bioconductor-hipathia=3.2.0
  - bioconductor-genomeinfodbdata=1.2.11
  - r-rlang=1.1.3                    # asegura la exportación de funciones como %||%
  - r-feather=0.3.5
  - r-data.table=1.15.4
  - r-ggplot2
  - r-dplyr
  - r-here=1.0.1
  - r-r.utils=2.12.3
  - r-reshape2
  - r-tibble
  - bioconductor-annotationhub=3.10.0
  - bioconductor-biocfilecache
  - r-matrixstats
  - bioconductor-summarizedexperiment
  - bioconductor-multiassayexperiment
  - bioconductor-s4vectors
  - bioconductor-iranges
  - bioconductor-genomicranges
  - r-igraph
  - r-dbplyr
  - bioconductor-limma
  - r-withr
  - r-rappdirs
  - r-curl
  - r-biocmanager
  - r-magrittr                      # para compatibilidad con pipes y %||%
  - bioconductor-biocgenerics=0.48.1  # mejora la compatibilidad de funciones básicas
